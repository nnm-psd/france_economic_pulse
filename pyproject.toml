[project]
name = "france-economic-pulse"
version = "0.1.0"
description = "Data pipeline and nowcast for the France Economic Pulse website"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pipeline = "pipeline.__main__:main"
backtest = "pipeline.model:main"
publish = "pipeline.publish:main"
experiments = "pipeline.experiments:main"
gdp-backtest = "pipeline.gdp_model:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
